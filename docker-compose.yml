services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-breachpoint}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    restart: "no"
    entrypoint: []
    command: ["bun", "run", "db:migrate"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    restart: "no"
    entrypoint: []
    command: ["bun", "run", "db:seed"]
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: prequalify_postgres_data
